[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeservo"
dynamic = ["version"]
description = "A deterministic control loop around AI-generated software changes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeServo contributors" }]
dependencies = []

[project.scripts]
codeservo = "codeservo.cli:main"

[tool.hatch.version]
path = "src/codeservo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codeservo"]
include = [
  "src/codeservo/resources/constitution.example.toml",
  "src/codeservo/resources/observation.schema.json",
  "src/codeservo/resources/review.schema.json",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64"]
requires-pixi = ">=0.77,<0.78"

[tool.pixi.dependencies]
python = "3.12.*"
# A measurement runs with the environment's PATH and nothing else, so every
# command a gate reaches for is declared here rather than found on the host.
git = ">=2.43"
mypy = ">=1.13,<2"
ruff = ">=0.12,<0.13"

[tool.pixi.pypi-dependencies]
codeservo = { path = ".", editable = true }

[tool.pixi.tasks]
# Every check names the tree it measures and writes nothing into it: a gate
# that left a cache behind would change the candidate it was only measuring.
test = "python -m unittest discover -s tests -v"
lint = "ruff check --no-cache src tests tools"
types = "mypy --cache-dir=/dev/null src"
compile = "python -m compileall -q src tests"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Rules that name a defect rather than a taste: pyflakes, import order the
# guidelines already require, the bugbear traps, comprehension and idiom
# modernisation, return-statement shape, arguments nothing reads, the patterns
# a Python security scan looks for, a declared complexity ceiling, the costly
# shapes in a loop, and reaching into another object's private members.
select = [
  "E4", "E7", "E9", "F", "I", "B", "C4", "UP", "RET", "ARG",
  "S", "C90", "PERF", "SLF",
]
# A controller runs processes. `S603` fires on every `subprocess` call whatever
# it carries, and `S607` on every command the locked environment's PATH is
# meant to resolve, which is what a measurement declaring its tools relies on.
ignore = ["S603", "S607"]

[tool.ruff.lint.mccabe]
# The smallest ceiling that does not force a straight-line validator apart for
# a metric's sake. A model reads denser code than the historic threshold of 4
# assumed, so the number is set from what this tree measures, not inherited.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# The Codex fixtures name `/tmp/worktree` as a string in an argv assertion
# rather than as a file, and the constitution tests reach for the writer they
# are measuring.
"tests/**" = ["S108", "SLF001"]

[tool.ruff.lint.flake8-bugbear]
# `Isolation` is a frozen dataclass of tuples, so one built in a default
# argument is shared safely and says what an unconfined call means.
extend-immutable-calls = ["codeservo.runtime.sandbox.Isolation"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# The shipped tree. The fixtures deliberately pass keyword dictionaries a
# checker cannot follow, and the suite is measured by the unit gate instead.
files = ["src"]
# The frozen documents are what this checks: a producer that omits, misnames
# or mistypes a field of the record fails here rather than in a run.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
