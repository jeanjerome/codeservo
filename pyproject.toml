[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeservo"
dynamic = ["version"]
description = "A deterministic control loop around AI-generated software changes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CodeServo contributors" }]
dependencies = []

[project.scripts]
codeservo = "codeservo.cli:main"

[tool.hatch.version]
path = "src/codeservo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codeservo"]
include = [
  "src/codeservo/constitution.example.toml",
  "src/codeservo/observation.schema.json",
  "src/codeservo/review.schema.json",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64"]
requires-pixi = ">=0.77,<0.78"

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
codeservo = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -m unittest discover -s tests -v"
