version = 1

[scope]
protected = [".codeservo/**", ".github/workflows/**", ".importlinter", "tools/**"]
max_changed_files = 14
max_diff_lines = 2200

[execution]
provider = "pixi"
manifest = "pyproject.toml"
environment = "default"

# Every gate answers twice: an exit code, which stays the verdict, and a
# document saying what it measured. Without the second one a run records that
# a gate passed and nothing about what it found.
[[gate]]
name = "lint"
phase = "quick"
task = "lint"
timeout_seconds = 120
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "types"
phase = "quick"
task = "types"
timeout_seconds = 300
baseline = true
result_format = "codeservo-json"

# The gate the suite answers for itself, and the two numbers that say it still
# measures what it measured. A suite that stops discovering runs fewer tests,
# and a test that stops running skips rather than fails: either leaves every
# remaining assertion green, and neither shows in an exit code. The
# confinement mechanism belongs to the host, so a test this host cannot
# exercise skips here rather than failing, and adding one moves the second
# number -- which is then a decision taken in the open instead of by accident.
[[gate]]
name = "unit"
phase = "quick"
task = "test"
timeout_seconds = 600
baseline = true
result_format = "codeservo-json"
ratchet = { tests = ">=", skipped = "<=" }

[[gate]]
name = "compile"
phase = "full"
task = "compile"
timeout_seconds = 120
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "architecture"
phase = "full"
task = "architecture"
timeout_seconds = 120
baseline = true
result_format = "codeservo-json"

# The one gate holding a ratchet, over the two numbers its document reports
# about the decision core: the proportion of it the suite reaches may not fall,
# and the number of its statements no test reaches may not grow. The second is
# the stricter and is the point of the pair. A statement added to the code that
# decides acceptance and covered by nothing is unmeasured deciding code,
# whichever way the proportion moved, and the remedy is to reach it. The floor
# in `pyproject.toml` is a different control: it is what a measurement taken
# outside a run holds, where there is no baseline to compare against.
[[gate]]
name = "coverage"
phase = "full"
task = "coverage"
timeout_seconds = 600
baseline = true
result_format = "codeservo-json"
ratchet = { line_coverage = ">=", missing = "<=" }

[[gate]]
name = "fuzz"
phase = "full"
task = "fuzz"
timeout_seconds = 300
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "duration"
phase = "full"
task = "duration"
timeout_seconds = 600
baseline = true
result_format = "codeservo-json"

[review]
blocking_severities = ["blocker", "major"]
