version = 1

[scope]
protected = [".codeservo/**", ".github/workflows/**", ".importlinter", "tools/**"]
max_changed_files = 14
max_diff_lines = 2200

[execution]
provider = "pixi"
manifest = "pyproject.toml"
environment = "default"

# Every gate answers twice: an exit code, which stays the verdict, and a
# document saying what it measured. Without the second one a run records that
# a gate passed and nothing about what it found.
[[gate]]
name = "lint"
phase = "quick"
task = "lint"
timeout_seconds = 120
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "types"
phase = "quick"
task = "types"
timeout_seconds = 300
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "unit"
phase = "quick"
task = "test"
timeout_seconds = 600
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "compile"
phase = "full"
task = "compile"
timeout_seconds = 120
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "architecture"
phase = "full"
task = "architecture"
timeout_seconds = 120
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "coverage"
phase = "full"
task = "coverage"
timeout_seconds = 600
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "fuzz"
phase = "full"
task = "fuzz"
timeout_seconds = 300
baseline = true
result_format = "codeservo-json"

[[gate]]
name = "duration"
phase = "full"
task = "duration"
timeout_seconds = 600
baseline = true
result_format = "codeservo-json"

# The acceptance sensor this run froze, and the one gate the actuator may not
# run. It names a command where every other gate names a task, because the
# controller passes the location it froze the sensor at in the environment and
# `pixi run --clean-env` empties the environment a task starts with. It still
# reports what it measured: a shell command keeps its environment, so the
# adapter reads from it both the sensor to run and the document to write.
[[gate]]
name = "verbatim-contract"
phase = "quick"
command = "python3.12 tools/gate.py sensor"
timeout_seconds = 300
baseline = false
result_format = "codeservo-json"
sensor = "codeservo/025-one-declaration-of-the-verbatim-contract"

[review]
blocking_severities = ["blocker", "major"]
